# air (github.com/air-verse/air) - live reload for the Go API during development.
#
#   air        # rebuilds and restarts cmd/api on every .go save (~1-2s), no container rebuild.
#
# Pair it with a host-reachable Postgres (docker-compose.dev.yml publishes one on 5433) and the
# Vite dev server for the frontend (web/, `npm start`), which proxies /api to this service. See
# the "Hot-reload dev loop" section in README.md.
root = "."
tmp_dir = "tmp"

[build]
  cmd = "go build -o ./tmp/api.exe ./cmd/api"
  bin = "./tmp/api.exe"
  include_ext = ["go"]
  exclude_dir = ["tmp", "web", "deploy", "docs", ".git"]
  delay = 400
  stop_on_error = true

[log]
  time = true
