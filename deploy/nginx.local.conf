# nginx for the local all-in-one stack.
#
# Deliberately simpler than web/docker/nginx.conf, which carries the production TLS and
# certbot machinery. Here there is no domain and no certificate - just the SPA on port 80 and
# the Go API behind /api/, so the browser talks to ONE origin and CORS never enters into it.
#
# That single-origin trick is also why the bundle is built with VITE_API_URL=/api: the
# hostname is not baked in, so this same image works whether you reach it as localhost, a LAN
# address, or anything else.

server {
    listen 80;
    server_name _;
    server_tokens off;

    root /usr/share/nginx/html;
    index index.html;

    client_max_body_size 50m;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # The SPA. try_files falls through to index.html so a deep link like /sheet/2026-09-14
    # is served by the app's router rather than answered with nginx's own 404.
    location / {
        try_files $uri $uri/ /index.html;
    }

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # Never cached: it is the file that names the hashed bundles, so a stale copy points the
    # browser at assets that no longer exist.
    location = /index.html {
        add_header Cache-Control "no-store, must-revalidate";
    }

    # The trailing slash on proxy_pass is load-bearing: it strips the /api prefix, so
    # /api/user/login reaches the Go service as /user/login. Without it the service would see
    # /api/user/login and answer its "not ported yet" 404 for every request.
    location /api/ {
        proxy_pass http://go-api:5002/;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }
}
