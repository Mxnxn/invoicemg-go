# nginx inside the frontend container. Serves the SPA and proxies the API, so the browser
# only ever talks to one origin - which is why VITE_API_URL can be the relative "/api", and
# why adding a domain needs no rebuild of the bundle.
#
# TLS is terminated here, from certificates certbot writes into a shared volume. The 443
# server lives in ssl.conf.disabled and is switched on by docker/enable-ssl.sh at container
# start, but ONLY once a certificate actually exists - nginx refuses to start if an
# ssl_certificate file is missing, which would otherwise deadlock the first boot: no cert
# until certbot can answer a challenge over port 80, and no port 80 until nginx starts.

server {
    listen 80;
    server_name invoicemg.in www.invoicemg.in;
    server_tokens off;

    root /usr/share/nginx/html;
    index index.html;

    client_max_body_size 50m;   # matches multer's limit in routes/UserInfo.js

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # ACME HTTP-01. Must stay on port 80 and must NOT redirect, both for issuance and for
    # every renewal after it - certbot writes the token here and Let's Encrypt fetches it
    # over plain HTTP.
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type "text/plain";
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    location = /index.html {
        add_header Cache-Control "no-store, must-revalidate";
    }

    location /api/ {
        proxy_pass http://api:5000/;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    location /uploads/ {
        proxy_pass http://api:5000/uploads/;
        proxy_set_header Host $host;
        expires 7d;
        add_header Cache-Control "public";
    }
}
