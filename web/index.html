<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<!-- SVG first: every modern browser prefers it and it carries its own light/dark
		     rule, so the mark stays legible on both tab strips. The .ico is the legacy and
		     Windows-shortcut fallback; apple-touch-icon is the iOS home screen tile. -->
		<link rel="icon" type="image/svg+xml" href="/favicon.svg" />
		<link rel="icon" sizes="16x16 32x32 48x48" href="/favicon.ico" />
		<link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="description" content="InvoiceMG turns client entries, material sheets and job cards into GST-ready invoices, delivery challans and ledgers - with a live job queue your floor can follow." />

		<!--
		  Share card. These are static, so they describe the marketing page for every route -
		  which is the right trade for an SPA: crawlers and link unfurlers do not run the
		  JavaScript, and / is the only URL anyone shares. Admin routes sit behind a login and
		  are never unfurled.
		
		  og:image must be absolute - WhatsApp and Facebook will not resolve a relative path -
		  so it points at production even when this build is served from the demo domain. The
		  file is public/og-image.png, 1200x630, regenerated by scripts/make-og-image.py.
		
		  THE HOST BELOW IS THE ONE THING TO CHANGE when this gets its own domain. It was
		  briefly set to invoice.manangraphics.com, taken from package.json's `homepage`,
		  which no longer resolves (NXDOMAIN) - so every unfurl fetched an image from a dead
		  host and showed no card at all. Point it at a host that actually serves this build.
		-->
		<meta property="og:type" content="website" />
		<meta property="og:site_name" content="InvoiceMG" />
		<meta property="og:url" content="https://invoicemg-demo.vercel.app/" />
		<meta property="og:title" content="InvoiceMG - invoicing and job tracking for print and packaging" />
		<meta property="og:description" content="InvoiceMG turns client entries, material sheets and job cards into GST-ready invoices, delivery challans and ledgers - with a live job queue your floor can follow." />
		<meta property="og:image" content="https://invoicemg-demo.vercel.app/og-image.png" />
		<meta property="og:image:width" content="1200" />
		<meta property="og:image:height" content="630" />
		<meta property="og:image:alt" content="InvoiceMG - invoicing, challans and job tracking for print and packaging" />
		<meta name="twitter:card" content="summary_large_image" />
		<meta name="twitter:title" content="InvoiceMG - invoicing and job tracking for print and packaging" />
		<meta name="twitter:description" content="InvoiceMG turns client entries, material sheets and job cards into GST-ready invoices, delivery challans and ledgers - with a live job queue your floor can follow." />
		<meta name="twitter:image" content="https://invoicemg-demo.vercel.app/og-image.png" />
		<link rel="preconnect" href="https://fonts.googleapis.com" />
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
		<link
			href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Outfit:wght@400;600;700;800;900&family=JetBrains+Mono:wght@400;700&family=Google+Sans:wght@400;500;700&family=IBM+Plex+Sans:wght@400;500;600&family=Open+Sans:wght@400;600;700&family=Reddit+Sans:wght@400;500;700&display=swap"
			rel="stylesheet"
		/>
		<title>InvoiceMG - invoicing and job tracking for print and packaging</title>
	</head>
	<body>
		<div id="root"></div>
		<script type="module" src="/src/index.js"></script>
	</body>
</html>
